## Hard-Won Knowledge

- **Silent failure is worse than loud failure.** `2>/dev/null || true` makes problems invisible. If something matters, it must fail loudly.
- **Staging race condition.** Git pre-commit hooks write to worktree but git commits from index. Hook-generated artifacts must be re-staged or they won't be in the commit.
- **Context drift in LLMs is structural.** Personality and approach change with compaction. Mechanical enforcement (hooks, gates) is more reliable than behavioral promises.
- **Stop restarting.** Defects in committed code are fixable with corrective commits. The cost of restarting is always higher than the cost of fixing.

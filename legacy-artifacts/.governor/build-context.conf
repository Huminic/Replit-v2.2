## What Is Nexxus

CRM/AI platform for automotive dealerships. Express 5 + React 18 + Vite 7 + Drizzle ORM + TypeScript 5.6 + PostgreSQL (Supabase). Five dealerships under Cage Automotive partner group.

## Architecture Decisions (A-001, 13 binding)

**Decision register:** evidence/A-001/decision-register.md

Key decisions:
- D-001: Current Supabase DB IS production (don't create new)
- D-002: Create NEW Supabase project for STAGING
- D-003: Production = Coolify container with pm2-runtime
- D-005: live.huminic.app → Coolify container, dev.huminicdev.com → PM2
- D-006: Caddy is sole proxy. Coolify Traefik stays off.
- D-007: Schema via drizzle-kit push (migration files STALE — missing 2 tables, 15+ columns). WILL drop columns removed from schema.
- D-009: No data sync between environments after launch
- D-011: CI/CD to production (push main → GitHub Actions → Coolify webhook)


name: Incident fix 2026-04-30 — set webhook secrets in live Coolify

# One-off workflow to remediate the production incident where chunk 2B's
# I-236 strict-secret-enforcement landed without the matching env vars
# being present on the live Coolify container. Sets VAPI_WEBHOOK_SECRET
# and TEXTMAGIC_WEBHOOK_SECRET via Coolify v4 API, then triggers redeploy.
#
# Trigger via: gh workflow run incident-fix-secrets-2026-04-30.yml
# After verifying success, this workflow file should be deleted in a
# follow-up commit and the HOTFIX_* repo secrets cleaned up.

on:
  workflow_dispatch:

jobs:
  set-coolify-env:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      HEALTH_URL: https://live.huminic.app/api/health
      VAPI_PROBE_URL: https://live.huminic.app/api/webhooks/vapi
      TM_PROBE_URL: https://live.huminic.app/api/webhooks/textmagic

    steps:
      - name: Parse Coolify webhook URL
        id: parse
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "ERROR: COOLIFY_WEBHOOK_URL secret is empty"; exit 1
          fi
          # Extract host (scheme + authority) for Coolify API base.
          BASE=$(echo "$COOLIFY_WEBHOOK_URL" | sed -E 's|^(https?://[^/]+).*|\1|')
          # Extract uuid query parameter.
          UUID=$(echo "$COOLIFY_WEBHOOK_URL" | sed -nE 's|.*[?&]uuid=([^&]+).*|\1|p')
          if [ -z "$UUID" ]; then
            echo "ERROR: could not parse uuid from COOLIFY_WEBHOOK_URL"; exit 1
          fi
          echo "Coolify base: $BASE"
          echo "App uuid: $UUID"
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      - name: Pre-fix probe (confirm 503 baseline)
        run: |
          for ep in vapi textmagic; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "https://live.huminic.app/api/webhooks/$ep" \
              -H "Authorization: Bearer junk-pre-fix-probe" \
              -H "Content-Type: application/json" \
              --max-time 10 -d '{}')
            echo "PRE-FIX  /api/webhooks/$ep -> HTTP $status (expecting 503)"
          done

      - name: Capture pre-deploy uptime
        id: pre
        run: |
          PRE=$(curl -sS --max-time 10 "$HEALTH_URL" | jq -r '(.uptime // 0) | floor' 2>/dev/null || echo 0)
          if [ -z "$PRE" ] || [ "$PRE" = "null" ]; then PRE=0; fi
          echo "Pre-deploy uptime: ${PRE}s"
          echo "pre_uptime=$PRE" >> $GITHUB_OUTPUT

      - name: Upsert VAPI_WEBHOOK_SECRET in Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE: ${{ steps.parse.outputs.base }}
          APP_UUID: ${{ steps.parse.outputs.uuid }}
          VAPI_VAL: ${{ secrets.HOTFIX_VAPI_WEBHOOK_SECRET }}
        run: |
          # Try PATCH first (update existing); fall back to POST (create) on 404.
          PAYLOAD=$(jq -n --arg k "VAPI_WEBHOOK_SECRET" --arg v "$VAPI_VAL" \
            '{key:$k,value:$v,is_preview:false,is_literal:true}')
          STATUS=$(curl -s -o /tmp/resp -w '%{http_code}' \
            -X PATCH "$COOLIFY_BASE/api/v1/applications/$APP_UUID/envs" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d "$PAYLOAD")
          echo "PATCH VAPI_WEBHOOK_SECRET -> $STATUS"
          if [ "$STATUS" = "404" ] || [ "$STATUS" = "405" ]; then
            STATUS=$(curl -s -o /tmp/resp -w '%{http_code}' \
              -X POST "$COOLIFY_BASE/api/v1/applications/$APP_UUID/envs" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Content-Type: application/json" \
              --max-time 30 \
              -d "$PAYLOAD")
            echo "POST VAPI_WEBHOOK_SECRET -> $STATUS"
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "ERROR: VAPI env upsert failed with $STATUS"
            cat /tmp/resp || true
            exit 1
          fi

      - name: Upsert TEXTMAGIC_WEBHOOK_SECRET in Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE: ${{ steps.parse.outputs.base }}
          APP_UUID: ${{ steps.parse.outputs.uuid }}
          TM_VAL: ${{ secrets.HOTFIX_TEXTMAGIC_WEBHOOK_SECRET }}
        run: |
          PAYLOAD=$(jq -n --arg k "TEXTMAGIC_WEBHOOK_SECRET" --arg v "$TM_VAL" \
            '{key:$k,value:$v,is_preview:false,is_literal:true}')
          STATUS=$(curl -s -o /tmp/resp -w '%{http_code}' \
            -X PATCH "$COOLIFY_BASE/api/v1/applications/$APP_UUID/envs" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -d "$PAYLOAD")
          echo "PATCH TEXTMAGIC_WEBHOOK_SECRET -> $STATUS"
          if [ "$STATUS" = "404" ] || [ "$STATUS" = "405" ]; then
            STATUS=$(curl -s -o /tmp/resp -w '%{http_code}' \
              -X POST "$COOLIFY_BASE/api/v1/applications/$APP_UUID/envs" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Content-Type: application/json" \
              --max-time 30 \
              -d "$PAYLOAD")
            echo "POST TEXTMAGIC_WEBHOOK_SECRET -> $STATUS"
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "ERROR: TextMagic env upsert failed with $STATUS"
            cat /tmp/resp || true
            exit 1
          fi

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          STATUS=$(curl -s -o /tmp/resp -w '%{http_code}' \
            -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            --max-time 30)
          echo "Coolify deploy webhook -> $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            cat /tmp/resp || true
            exit 1
          fi

      - name: Verify deployment (uptime regression + webhook 401)
        run: |
          PRE='${{ steps.pre.outputs.pre_uptime }}'
          echo "Polling for restart + webhook secret-set state. Pre-uptime ${PRE}s"
          DEPLOYED=false
          VAPI_OK=false
          TM_OK=false
          for i in $(seq 1 30); do
            sleep 20
            CUR=$(curl -sS --max-time 10 "$HEALTH_URL" 2>/dev/null | jq -r '(.uptime // 0) | floor' 2>/dev/null || echo 0)
            if [ -z "$CUR" ] || [ "$CUR" = "null" ]; then CUR=0; fi
            VAPI_HTTP=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' \
              -X POST "$VAPI_PROBE_URL" \
              -H "Authorization: Bearer junk-post-fix-probe" \
              -H "Content-Type: application/json" \
              -d '{}' 2>/dev/null || echo 000)
            TM_HTTP=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' \
              -X POST "$TM_PROBE_URL" \
              -H "Authorization: Bearer junk-post-fix-probe" \
              -H "Content-Type: application/json" \
              -d '{}' 2>/dev/null || echo 000)
            echo "[poll $i/30] uptime=${CUR}s vapi=$VAPI_HTTP textmagic=$TM_HTTP"
            # Restart confirmed when uptime regressed + below 600s
            if [ "$PRE" -gt 0 ] && [ "$CUR" -lt "$PRE" ] && [ "$CUR" -lt 600 ]; then DEPLOYED=true; fi
            if [ "$PRE" -eq 0 ] && [ "$CUR" -gt 0 ] && [ "$CUR" -lt 600 ]; then DEPLOYED=true; fi
            # Secret set when probe returns NOT 503 (could be 401 or 400)
            [ "$VAPI_HTTP" != "503" ] && [ "$VAPI_HTTP" != "000" ] && VAPI_OK=true
            [ "$TM_HTTP" != "503" ] && [ "$TM_HTTP" != "000" ] && TM_OK=true
            if [ "$DEPLOYED" = "true" ] && [ "$VAPI_OK" = "true" ] && [ "$TM_OK" = "true" ]; then
              echo "Incident fix CONFIRMED: container restarted, both webhook secrets now in container env."
              break
            fi
          done
          if [ "$DEPLOYED" != "true" ]; then echo "ERROR: container did not restart"; exit 1; fi
          if [ "$VAPI_OK" != "true" ]; then echo "ERROR: VAPI still 503"; exit 1; fi
          if [ "$TM_OK" != "true" ]; then echo "ERROR: TextMagic still 503"; exit 1; fi
